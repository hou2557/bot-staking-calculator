<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#101914" />
  <meta name="description" content="BOT 日复利质押收益计算器" />
  <title>BOT 质押收益计算器</title>
  <style>
    :root{--ink:#111914;--sub:#77827c;--bg:#f3f5f2;--card:#fff;--line:#e2e7e3;--green:#42d895;--green-dark:#08784c;--dark:#101914;--soft:#e9f8f0}
    *{box-sizing:border-box}body{margin:0;background:#e1e6e2;color:var(--ink);font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}.app{width:min(100%,430px);min-height:100vh;margin:0 auto;background:var(--bg);box-shadow:0 0 60px rgba(16,35,26,.14);padding-bottom:max(24px,env(safe-area-inset-bottom))}main{padding:calc(14px + env(safe-area-inset-top)) 14px 24px}
    .page-nav{display:flex;align-items:flex-start;gap:11px;margin:0 2px 18px}.back-link{width:38px;height:38px;flex:0 0 auto;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;background:#fff;color:var(--ink);box-shadow:0 5px 14px rgba(18,45,32,.05)}.back-link svg{width:19px;height:19px}.page-head h1{margin:1px 0 0;font-size:24px;letter-spacing:-.04em}.page-head p{margin:5px 0 0;color:var(--sub);font-size:12px;line-height:1.5}
    .market-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;padding:11px 13px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.72)}.market-token{display:flex;align-items:center;gap:9px}.market-icon{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--dark);color:var(--green);font-size:10px;font-weight:850}.market-copy b{display:block;font-size:14px}.market-copy span,.market-price span{display:block;color:var(--sub);font-size:12px;margin-top:2px}.market-price{text-align:right}.market-price strong{display:block;font-size:18px;margin-top:2px}
    .step{margin-top:18px}.step:first-of-type{margin-top:0}.section-title{display:flex;align-items:center;justify-content:space-between;margin:0 2px 9px}.section-title h2{margin:0;font-size:18px;letter-spacing:-.02em}.section-title span{color:var(--sub);font-size:12px}.card{padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--card);box-shadow:0 8px 24px rgba(18,45,32,.05)}
    .label{display:flex;justify-content:space-between;align-items:center;color:var(--sub);font-size:12px}.balance{color:#52635a}.amount-line{height:64px;display:flex;align-items:center;border-bottom:1px solid var(--line)}.amount-line input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font-size:32px;font-weight:850;letter-spacing:-.045em}.unit{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:850}.coin{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;background:var(--dark);color:var(--green);font-size:10px}.usd{margin-top:9px;color:var(--green-dark);font-size:14px;font-weight:850}.quick{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:13px}.quick button,.term-grid button{min-width:0;border:1px solid var(--line);border-radius:9px;background:#f7f9f7;color:#67746e;font-size:12px;cursor:pointer}.quick button{padding:9px 3px}.quick button:last-child,.quick button.active,.term-grid button.active{background:var(--soft);border-color:#b9e8cf;color:var(--green-dark);font-weight:850}.error{min-height:18px;margin-top:5px;color:#d54e5e;font-size:12px}
    .parameter-card{padding:15px}.param-block+.param-block{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}.rate-head{display:flex;align-items:center;justify-content:space-between}.rate-head span{color:#65736c;font-size:13px;font-weight:700}.rate-head strong{color:var(--green-dark);font-size:23px;letter-spacing:-.03em}.range{width:100%;height:7px;margin:14px 0 7px;border-radius:999px;appearance:none;background:linear-gradient(to right,var(--green) 0 var(--progress),#dfe5e1 var(--progress) 100%);outline:none}.range::-webkit-slider-thumb{width:24px;height:24px;border:4px solid #fff;border-radius:50%;appearance:none;background:var(--green-dark);box-shadow:0 2px 8px rgba(8,120,76,.3)}.range::-moz-range-thumb{width:16px;height:16px;border:4px solid #fff;border-radius:50%;background:var(--green-dark);box-shadow:0 2px 8px rgba(8,120,76,.3)}.range-scale{display:flex;justify-content:space-between;color:#8c9892;font-size:12px}
    .days-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.days-head label{color:#65736c;font-size:13px;font-weight:700}.days-input{display:flex;align-items:center;gap:5px;width:124px;padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:#f8faf8;color:#65736c;font-size:12px}.days-input:focus-within{border-color:#9eddbd;background:#f2fbf6}.days-input input{width:78px;border:0;outline:0;background:transparent;color:var(--ink);font-size:16px;font-weight:850;text-align:right}.term-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.term-grid button{padding:9px 3px}
    .result-card{overflow:hidden;padding:0;border-color:#203129;background:var(--dark);color:#fff}.result-head{padding:15px 16px 12px;border-bottom:1px solid rgba(255,255,255,.1)}.result-head strong{display:block;font-size:17px}.result-head span{display:block;margin-top:4px;color:#9eb0a6;font-size:12px}.result-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:66px;padding:13px 16px;border-bottom:1px solid rgba(255,255,255,.1)}.result-row:last-child{border-bottom:0}.result-row span{color:#b8c5be;font-size:13px}.result-row strong{min-width:0;color:var(--green);font-size:17px;text-align:right;word-break:break-word}.formula{margin:11px 3px 0;color:#8c9892;font-size:12px;line-height:1.55;text-align:center}
    a{text-decoration:none}button,input{font:inherit}a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--green);outline-offset:2px}@media(min-width:700px){body{padding:22px 0}.app{border-radius:28px;min-height:calc(100vh - 44px);overflow:hidden}}
  </style>
</head>
<body>
  <div class="app">
    <main>
      <header class="page-nav"><a class="back-link" href="./index.html" aria-label="返回 BOT 质押页面"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 5 8 12l7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a><div class="page-head"><h1>收益计算器</h1><p>自由设置每日收益率与质押期限</p></div></header>
      <div class="market-bar"><div class="market-token"><span class="market-icon">BOT</span><div class="market-copy"><b>BOT</b><span>日复利收益测算</span></div></div><div class="market-price"><span>当前参考单价</span><strong>$12.20</strong></div></div>

      <section class="step"><div class="section-title"><h2>质押数量</h2><span>STEP 01</span></div><div class="card"><div class="label"><span>输入 BOT 数量</span><span class="balance">可用 12,580 BOT</span></div><div class="amount-line"><input id="amount" aria-label="BOT 质押数量" inputmode="decimal" value="1000"><div class="unit"><span class="coin">B</span>BOT</div></div><div class="usd" id="principalUsd">≈ $12,200.00</div><div class="quick" aria-label="快捷金额"><button data-amount="10" type="button">10</button><button data-amount="100" type="button">100</button><button data-amount="500" type="button">500</button><button data-amount="1000" type="button">1,000</button><button data-amount="12580" type="button">MAX</button></div><div class="error" id="amountError" aria-live="polite"></div></div></section>

      <section class="step"><div class="section-title"><h2>参数设置</h2><span>STEP 02</span></div><div class="card parameter-card"><div class="param-block"><div class="rate-head"><span>日收益率 DPR</span><strong id="rateValue">0.20%</strong></div><input class="range" id="rate" type="range" min="0" max="1" step="0.01" value="0.2" aria-label="每日收益率 DPR"><div class="range-scale"><span>0%</span><span>最高 1%</span></div></div><div class="param-block"><div class="days-head"><label for="customDays">质押天数</label><div class="days-input"><input id="customDays" type="number" min="1" step="1" inputmode="numeric" value="30" aria-label="质押天数"><span>天</span></div></div><div class="term-grid" aria-label="快捷质押期限"><button class="active" data-days="30" type="button">30 天</button><button data-days="90" type="button">90 天</button><button data-days="180" type="button">180 天</button><button data-days="360" type="button">360 天</button><button data-days="540" type="button">540 天</button><button data-days="1080" type="button">1,080 天</button></div><div class="error" id="daysError" aria-live="polite"></div></div></div></section>

      <section class="step"><div class="section-title"><h2>预计结果</h2><span>日复利</span></div><div class="card result-card" aria-live="polite"><div class="result-head"><strong>到期复利收益</strong><span id="resultMeta">30 天 · DPR 0.20%</span></div><div class="result-row"><span>收益 BOT 数量</span><strong id="rewardBot">+61.7729 BOT</strong></div><div class="result-row"><span>等值美元</span><strong id="rewardUsd">$753.63</strong></div></div><p class="formula">复利收益 = 质押数量 × ((1 + DPR) ^ 天数 − 1)，结果仅供测算参考。</p></section>
    </main>
  </div>
  <script>
    const PRICE=12.2,MAX=12580;
    const $=selector=>document.querySelector(selector),$$=selector=>[...document.querySelectorAll(selector)];
    const fmt=(number,digits=2)=>Number(number).toLocaleString('en-US',{minimumFractionDigits:digits,maximumFractionDigits:digits});
    const usd=number=>`$${fmt(number,2)}`;
    function getAmount(){const number=Number($('#amount').value.replace(/,/g,''));return Number.isFinite(number)?Math.max(0,number):0}
    function getDays(){const number=Number($('#customDays').value);return Number.isInteger(number)&&number>0?number:0}
    function render(){
      const amount=getAmount(),ratePercent=Number($('#rate').value),days=getDays(),rate=ratePercent/100;
      const amountMessage=amount<=0?'请输入大于 0 的 BOT 数量':amount>MAX?`输入数量超过可用余额 ${fmt(MAX,0)} BOT`:'';
      const daysMessage=days<=0?'请输入大于 0 的整数天数':'';
      $('#amountError').textContent=amountMessage;$('#daysError').textContent=daysMessage;
      $('#principalUsd').textContent=`≈ ${usd(amount*PRICE)}`;$('#rateValue').textContent=`${ratePercent.toFixed(2)}%`;
      $('#rate').style.setProperty('--progress',`${ratePercent*100}%`);
      $$('[data-amount]').forEach(button=>button.classList.toggle('active',Number(button.dataset.amount)===amount));
      $$('[data-days]').forEach(button=>button.classList.toggle('active',days===Number(button.dataset.days)));
      const reward=amountMessage||daysMessage?NaN:amount*(Math.pow(1+rate,days)-1),valid=Number.isFinite(reward);
      $('#resultMeta').textContent=days>0?`${fmt(days,0)} 天 · DPR ${ratePercent.toFixed(2)}%`:'等待输入有效天数';
      $('#rewardBot').textContent=valid?`+${fmt(reward,4)} BOT`:'--';$('#rewardUsd').textContent=valid?usd(reward*PRICE):'--';
      if(!valid&&!amountMessage&&!daysMessage)$('#daysError').textContent='计算结果过大，请减少收益率或天数';
    }
    $('#amount').addEventListener('input',render);$('#rate').addEventListener('input',render);
    $$('[data-amount]').forEach(button=>button.addEventListener('click',()=>{$('#amount').value=button.dataset.amount;render()}));
    $$('[data-days]').forEach(button=>button.addEventListener('click',()=>{$('#customDays').value=button.dataset.days;render()}));
    $('#customDays').addEventListener('input',render);
    render();
  </script>
</body>
</html>
