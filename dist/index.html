<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#101914" />
  <meta name="description" content="BOT 质押复利收益对比" />
  <title>BOT 质押收益计算器</title>
  <style>
    :root{--ink:#111914;--sub:#77827c;--bg:#f3f5f2;--card:#fff;--line:#e2e7e3;--green:#42d895;--green-dark:#08784c;--dark:#101914;--soft:#e9f8f0}
    *{box-sizing:border-box}body{margin:0;background:#e1e6e2;color:var(--ink);font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}.app{width:min(100%,430px);min-height:100vh;margin:0 auto;background:var(--bg);box-shadow:0 0 60px rgba(16,35,26,.14);padding-bottom:max(22px,env(safe-area-inset-bottom))}
    main{padding:calc(14px + env(safe-area-inset-top)) 14px 22px}.market-bar{display:flex;align-items:center;justify-content:space-between;margin:0 2px 20px}.market-token{display:flex;align-items:center;gap:9px}.market-icon{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--dark);color:var(--green);font-size:10px;font-weight:850}.market-copy b{display:block;font-size:14px}.market-copy span{display:block;color:var(--sub);font-size:12px;margin-top:2px}.market-price{text-align:right}.market-price span{display:block;color:var(--sub);font-size:12px}.market-price strong{display:block;font-size:18px;margin-top:2px}.page-head{margin:0 2px 20px}.page-head h1{margin:0;font-size:25px;letter-spacing:-.04em}.page-head p{margin:7px 0 0;color:var(--sub);font-size:13px;line-height:1.5}.section-title{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px}.section-title h2{margin:0;font-size:18px;letter-spacing:-.02em}.section-title span{color:var(--sub);font-size:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 24px rgba(18,45,32,.05)}
    .amount-card{padding:16px}.label{display:flex;justify-content:space-between;align-items:center;color:var(--sub);font-size:12px}.balance{color:#52635a}.amount-line{height:64px;display:flex;align-items:center;border-bottom:1px solid var(--line)}.amount-line input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font-size:32px;font-weight:850;letter-spacing:-.045em}.unit{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:850}.coin{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;background:var(--dark);color:var(--green);font-size:10px}.usd{margin-top:9px;color:var(--green-dark);font-size:14px;font-weight:850}.quick{display:flex;gap:7px;margin-top:13px}.quick button{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;background:#f7f9f7;padding:8px 4px;color:#67746e;font-size:12px;cursor:pointer}.quick button:last-child,.quick button.active{background:var(--soft);border-color:#b9e8cf;color:var(--green-dark);font-weight:800}.error{min-height:18px;margin-top:4px;color:#d54e5e;font-size:12px}
    .plans-section{margin-top:20px}.note{margin:-1px 0 10px;color:#7b8881;font-size:12px;line-height:1.55}.table{overflow:hidden}.table-head,.plan{display:grid;grid-template-columns:.64fr .76fr 1.08fr 1.62fr;align-items:center;column-gap:5px}.table-head{padding:10px;background:#f8faf8;border-bottom:1px solid var(--line);color:#8b9690;font-size:12px;line-height:1.25}.table-head span:last-child{text-align:right}.plan{min-height:78px;padding:12px 10px;border-bottom:1px solid var(--line)}.plan:last-child{border-bottom:0}.cell{min-width:0}.identity b{display:block;font-size:14px}.identity span{display:block;color:#99a39e;font-size:12px;margin-top:3px}.rate-cell b{display:block;color:var(--green-dark);font-size:14px}.rate-cell span,.release-cell span,.yield-cell span{display:block;color:#9aa49f;font-size:12px;margin-top:3px}.release-cell b{display:block;font-size:12px;line-height:1.25}.yield-cell{text-align:right}.yield-cell b{display:block;color:var(--green-dark);font-size:12px;line-height:1.25}.yield-cell span{color:var(--green-dark);font-weight:850;white-space:nowrap}.footnote{margin:13px 4px 0;color:#98a39d;text-align:center;font-size:12px;line-height:1.55}
    button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--green);outline-offset:2px}
    @media(min-width:700px){body{padding:22px 0}.app{border-radius:28px;min-height:calc(100vh - 44px);overflow:hidden}}
  </style>
</head>
<body>
  <div class="app">
    <main>
      <div class="market-bar"><div class="market-token"><span class="market-icon">BOT</span><div class="market-copy"><b>BOT</b><span>质押收益服务</span></div></div><div class="market-price"><span>当前参考单价</span><strong>$12.20</strong></div></div>
      <header class="page-head"><h1>收益计算器</h1><p>输入 BOT 数量，查看不同质押方案的预计收益</p></header>
      <section><div class="section-title"><h2>输入质押数量</h2><span>STEP 01</span></div><div class="card amount-card"><div class="label"><span>质押金额</span><span class="balance">可用 12,580 BOT</span></div><div class="amount-line"><input id="amount" aria-label="BOT 质押数量" inputmode="decimal" value="1000"><div class="unit"><span class="coin">B</span>BOT</div></div><div class="usd" id="principalUsd">≈ $12,200.00</div><div class="quick" aria-label="快捷金额"><button data-amount="10" type="button">10</button><button data-amount="100" type="button">100</button><button data-amount="1000" type="button">1,000</button><button data-amount="5000" type="button">5,000</button><button data-amount="12580" type="button">MAX</button></div><div class="error" id="error" aria-live="polite"></div></div></section>
      <section class="plans-section"><div class="section-title"><h2>收益方案</h2><span>按日复利</span></div><p class="note">昨日收益与未释放本金共同参与今日计息；活期收益统一按持有 30 天估算。</p><div class="card table"><div class="table-head"><span>方案</span><span>日收益率</span><span>每日释放本金</span><span>总收益 / 价值</span></div><div id="planList"></div></div><div class="footnote">以上结果为模型估算，到期总收益不含原始本金，不构成收益承诺或投资建议。</div></section>
    </main>
  </div>
  <script>
    const PRICE=12.2,MAX=12580;
    const plans=[
      {key:'flex',name:'活期',rate:.002,days:30,type:'灵活',release:'随时提取'},
      {key:'30',name:'30 天',rate:.0027,days:30,type:'定期'},
      {key:'90',name:'90 天',rate:.0033,days:90,type:'定期'},
      {key:'180',name:'180 天',rate:.0042,days:180,type:'定期'},
      {key:'360',name:'360 天',rate:.0052,days:360,type:'定期'}
    ];
    const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
    const fmt=(n,d=2)=>Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
    const usd=n=>`$${fmt(n,2)}`;
    function amount(){const n=Number($('#amount').value.replace(/,/g,''));return Number.isFinite(n)?Math.max(0,n):0}
    function calculate(value,p){
      if(p.key==='flex')return value*(Math.pow(1+p.rate,p.days)-1);
      const dailyRelease=value/p.days;let balance=value,total=0;
      for(let day=1;day<=p.days;day++){const reward=balance*p.rate;total+=reward;balance=balance+reward-dailyRelease}
      return total;
    }
    function validate(value){let message='';if(value<=0)message='请输入大于 0 的 BOT 数量';else if(value>MAX)message=`输入数量超过可用余额 ${fmt(MAX,0)} BOT`;$('#error').textContent=message}
    function render(){
      const value=amount();validate(value);$('#principalUsd').textContent=`≈ ${usd(value*PRICE)}`;
      $$('[data-amount]').forEach(button=>button.classList.toggle('active',Number(button.dataset.amount)===value));
      $('#planList').innerHTML=plans.map(p=>{const reward=calculate(value,p);const release=p.key==='flex'?p.release:fmt(value/p.days,4);return `<article class="plan"><div class="cell identity"><b>${p.name}</b><span>${p.type}</span></div><div class="cell rate-cell"><b>${fmt(p.rate*100,2)}%</b><span>每日</span></div><div class="cell release-cell"><b>${release}</b><span>${p.key==='flex'?'本金及收益':'BOT / 日'}</span></div><div class="cell yield-cell"><b>+${fmt(reward,4)} BOT</b><span>${usd(reward*PRICE)}${p.key==='flex'?' · 30天':''}</span></div></article>`}).join('');
    }
    $('#amount').addEventListener('input',render);$$('[data-amount]').forEach(button=>button.addEventListener('click',()=>{$('#amount').value=button.dataset.amount;render()}));render();
  </script>
</body>
</html>
