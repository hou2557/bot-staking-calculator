<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#101914" />
  <meta name="description" content="BOT 质押复利收益对比" />
  <title>BOT 质押收益计算器</title>
  <style>
    :root{--ink:#111914;--sub:#77827c;--bg:#f3f5f2;--card:#fff;--line:#e2e7e3;--green:#42d895;--green-dark:#08784c;--dark:#101914;--soft:#e9f8f0}
    *{box-sizing:border-box}body{margin:0;background:#e1e6e2;color:var(--ink);font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}.app{width:min(100%,430px);min-height:100vh;margin:0 auto;background:var(--bg);box-shadow:0 0 60px rgba(16,35,26,.14);padding-bottom:max(22px,env(safe-area-inset-bottom))}
    main{padding:calc(14px + env(safe-area-inset-top)) 14px 14px}.market-bar{display:flex;align-items:center;justify-content:space-between;margin:0 2px 14px}.market-token{display:flex;align-items:center;gap:8px}.market-icon{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--dark);color:var(--green);font-size:9px;font-weight:850}.market-copy b{display:block;font-size:11px}.market-copy span{display:block;color:var(--sub);font-size:8px;margin-top:1px}.market-price{text-align:right}.market-price span{display:block;color:var(--sub);font-size:8px}.market-price strong{display:block;font-size:14px;margin-top:1px}.section-title{display:flex;align-items:center;justify-content:space-between;margin:0 0 8px}.section-title h2{margin:0;font-size:15px;letter-spacing:-.02em}.section-title span{color:var(--sub);font-size:8px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 24px rgba(18,45,32,.05)}
    .amount-card{padding:14px}.label{display:flex;justify-content:space-between;align-items:center;color:var(--sub);font-size:9px}.balance{color:#52635a}.amount-line{height:57px;display:flex;align-items:center;border-bottom:1px solid var(--line)}.amount-line input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font-size:28px;font-weight:850;letter-spacing:-.045em}.unit{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:850}.coin{width:25px;height:25px;border-radius:50%;display:grid;place-items:center;background:var(--dark);color:var(--green);font-size:9px}.usd{margin-top:6px;color:#89958f;font-size:9px}.quick{display:flex;gap:6px;overflow-x:auto;margin-top:10px;scrollbar-width:none}.quick::-webkit-scrollbar{display:none}.quick button{flex:0 0 auto;border:1px solid var(--line);border-radius:8px;background:#f7f9f7;padding:6px 10px;color:#67746e;font-size:9px;cursor:pointer}.quick button:last-child{background:var(--soft);border-color:#cbeedc;color:var(--green-dark)}.error{min-height:10px;margin-top:3px;color:#d54e5e;font-size:8px}
    .plans-section{margin-top:19px}.note{margin:-1px 0 8px;color:#7b8881;font-size:8px;line-height:1.45}.table{overflow:hidden}.table-head,.plan{display:grid;grid-template-columns:.7fr .78fr 1.05fr 1.4fr;align-items:center;column-gap:6px}.table-head{padding:8px 10px;background:#f8faf8;border-bottom:1px solid var(--line);color:#8b9690;font-size:7px}.table-head span:last-child{text-align:right}.plan{min-height:58px;padding:9px 10px;border-bottom:1px solid var(--line)}.plan:last-child{border-bottom:0}.cell{min-width:0}.identity b{display:block;font-size:11px}.identity span{display:block;color:#99a39e;font-size:7px;margin-top:2px}.rate-cell b{display:block;color:var(--green-dark);font-size:11px}.rate-cell span,.release-cell span,.yield-cell span{display:block;color:#9aa49f;font-size:7px;margin-top:2px}.release-cell b{display:block;font-size:9px;line-height:1.2}.yield-cell{text-align:right}.yield-cell b{display:block;color:var(--green-dark);font-size:10px;line-height:1.15}.yield-cell span{white-space:nowrap}.footnote{margin:11px 4px 0;color:#98a39d;text-align:center;font-size:7px;line-height:1.5}
    @media(min-width:700px){body{padding:22px 0}.app{border-radius:28px;min-height:calc(100vh - 44px);overflow:hidden}}
  </style>
</head>
<body>
  <div class="app">
    <main>
      <div class="market-bar"><div class="market-token"><span class="market-icon">BOT</span><div class="market-copy"><b>BOT</b><span>质押收益计算器</span></div></div><div class="market-price"><span>当前参考单价</span><strong>$12.20</strong></div></div>
      <section>
        <div class="section-title"><h2>输入质押数量</h2><span>STEP 01</span></div>
        <div class="card amount-card">
          <div class="label"><span>质押金额</span><span class="balance">可用 12,580 BOT</span></div>
          <div class="amount-line"><input id="amount" aria-label="BOT 质押数量" inputmode="decimal" value="1000"><div class="unit"><span class="coin">B</span>BOT</div></div>
          <div class="usd" id="principalUsd">≈ $12,200.00</div>
          <div class="quick"><button data-amount="100">100</button><button data-amount="500">500</button><button data-amount="1000">1,000</button><button data-amount="5000">5,000</button><button data-amount="12580">MAX</button></div>
          <div class="error" id="error"></div>
        </div>
      </section>

      <section class="plans-section">
        <div class="section-title"><h2>收益方案</h2><span>按日复利</span></div>
        <p class="note">昨日收益与未释放本金共同参与今日计息；活期收益统一按持有 30 天估算。</p>
        <div class="card table"><div class="table-head"><span>方案</span><span>日收益率</span><span>每日释放本金</span><span>总收益 / 价值</span></div><div id="planList"></div></div>
        <div class="footnote">以上结果为模型估算，到期总收益不含原始本金，不构成收益承诺或投资建议。</div>
      </section>
    </main>
  </div>
  <script>
    const PRICE=12.2,MAX=12580;
    const plans=[
      {key:'flex',name:'活期',rate:.002,days:30,type:'灵活',release:'随时提取'},
      {key:'30',name:'30 天',rate:.0027,days:30,type:'定期'},
      {key:'90',name:'90 天',rate:.0033,days:90,type:'定期'},
      {key:'180',name:'180 天',rate:.0042,days:180,type:'定期'},
      {key:'360',name:'360 天',rate:.0052,days:360,type:'定期'}
    ];
    const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
    const fmt=(n,d=2)=>Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
    const bot=(n,d=4)=>`${fmt(n,d)} BOT`,usd=n=>`$${fmt(n,2)}`;
    function amount(){const n=Number($('#amount').value.replace(/,/g,''));return Number.isFinite(n)?Math.max(0,n):0}
    function calculate(value,p){
      if(p.key==='flex')return value*(Math.pow(1+p.rate,p.days)-1);
      const dailyRelease=value/p.days;let balance=value,total=0;
      for(let day=1;day<=p.days;day++){const reward=balance*p.rate;total+=reward;balance=balance+reward-dailyRelease}
      return total;
    }
    function validate(value){let message='';if(value<=0)message='请输入大于 0 的 BOT 数量';else if(value>MAX)message=`输入数量超过可用余额 ${fmt(MAX,0)} BOT`;$('#error').textContent=message}
    function render(){
      const value=amount();validate(value);$('#principalUsd').textContent=`≈ ${usd(value*PRICE)}`;
      $('#planList').innerHTML=plans.map(p=>{const reward=calculate(value,p);const release=p.key==='flex'?p.release:fmt(value/p.days,4);return `<article class="plan"><div class="cell identity"><b>${p.name}</b><span>${p.type}</span></div><div class="cell rate-cell"><b>${fmt(p.rate*100,2)}%</b><span>每日</span></div><div class="cell release-cell"><b>${release}</b><span>${p.key==='flex'?'本金及收益':'BOT / 日'}</span></div><div class="cell yield-cell"><b>+${fmt(reward,4)} BOT</b><span>${usd(reward*PRICE)}${p.key==='flex'?' · 30天':''}</span></div></article>`}).join('');
    }
    $('#amount').addEventListener('input',render);$$('[data-amount]').forEach(button=>button.addEventListener('click',()=>{$('#amount').value=button.dataset.amount;render()}));render();
  </script>
</body>
</html>
