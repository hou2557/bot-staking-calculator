<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#101914" />
  <meta name="description" content="BOT 质押服务" />
  <title>BOT 质押</title>
  <style>
    :root{--ink:#111914;--sub:#77827c;--bg:#f3f5f2;--card:#fff;--line:#e2e7e3;--green:#42d895;--green-dark:#08784c;--dark:#101914;--soft:#e9f8f0}
    *{box-sizing:border-box}body{margin:0;background:#e1e6e2;color:var(--ink);font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}.app{width:min(100%,430px);min-height:100vh;margin:0 auto;background:var(--bg);box-shadow:0 0 60px rgba(16,35,26,.14);padding-bottom:max(22px,env(safe-area-inset-bottom))}
    main{padding:calc(14px + env(safe-area-inset-top)) 14px 22px}.market-bar{display:flex;align-items:center;justify-content:space-between;margin:0 2px 20px}.market-token{display:flex;align-items:center;gap:9px}.market-icon{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--dark);color:var(--green);font-size:10px;font-weight:850}.market-copy b{display:block;font-size:14px}.market-copy span{display:block;color:var(--sub);font-size:12px;margin-top:2px}.market-price{text-align:right}.market-price span{display:block;color:var(--sub);font-size:12px}.market-price strong{display:block;font-size:18px;margin-top:2px}
    .title-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 2px 15px}.title-row h1{margin:0;font-size:25px;letter-spacing:-.04em}.calculator-link{display:flex;align-items:center;gap:7px;flex:0 0 auto;border:1px solid #b9e8cf;border-radius:999px;background:var(--soft);padding:9px 13px;color:var(--green-dark);font-size:14px;font-weight:850;box-shadow:0 5px 14px rgba(20,124,79,.08);text-decoration:none}.calculator-link svg{width:16px;height:16px}.calculator-link:active{transform:translateY(1px)}
    .stake-card{position:relative;overflow:hidden;min-height:180px;border:1px solid #26362e;border-radius:20px;background:linear-gradient(135deg,#111a15 0%,#101914 60%,#193929 100%);padding:25px;color:#fff;box-shadow:0 16px 35px rgba(13,37,25,.13)}.stake-card::after{content:"BOT";position:absolute;right:-15px;bottom:-24px;color:rgba(66,216,149,.10);font-size:86px;font-weight:900;letter-spacing:-.08em}.stake-card strong{display:block;color:var(--green);font-size:22px}.stake-card p{position:relative;z-index:1;margin:14px 0 0;color:#dbe6df;font-size:15px;line-height:1.65}.stake-card .tip{position:relative;z-index:1;display:inline-flex;align-items:center;gap:6px;margin-top:19px;color:#aab9b1;font-size:12px}.stake-card .tip::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(66,216,149,.1)}
    .status-card{margin-top:18px;padding:16px;border:1px solid var(--line);border-radius:16px;background:#fff;box-shadow:0 8px 24px rgba(18,45,32,.05)}.status-row{display:flex;align-items:center;justify-content:space-between}.status-row span{color:var(--sub);font-size:12px}.status-row strong{font-size:15px}.status-line{height:1px;margin:14px 0;background:var(--line)}.status-tip{margin:0;color:#7b8881;font-size:12px;line-height:1.55}
    a:focus-visible{outline:2px solid var(--green);outline-offset:2px}@media(min-width:700px){body{padding:22px 0}.app{border-radius:28px;min-height:calc(100vh - 44px);overflow:hidden}}
  </style>
</head>
<body>
  <div class="app">
    <main>
      <div class="market-bar"><div class="market-token"><span class="market-icon">BOT</span><div class="market-copy"><b>BOT</b><span>质押收益服务</span></div></div><div class="market-price"><span>当前参考单价</span><strong>$12.20</strong></div></div>
      <div class="title-row"><h1>BOT质押</h1><a class="calculator-link" href="./calculator.html"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="4" y="2.75" width="16" height="18.5" rx="3" stroke="currentColor" stroke-width="1.8"/><path d="M7.5 7h9M8 11h2m4 0h2m-8 4h2m4 0h2m-8 4h2m4 0h2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>收益计算器</a></div>
      <section class="stake-card" aria-label="BOT 质押简介"><strong>BOT质押</strong><p>质押 BOT 获得收益<br>复利计算，方案一屏对比</p><span class="tip">点击右上角进入收益计算器</span></section>
      <section class="status-card" aria-label="质押状态"><div class="status-row"><span>当前质押</span><strong>0 BOT</strong></div><div class="status-line"></div><p class="status-tip">选择收益计算器，可按投入数量对比活期与定期方案的预计收益。</p></section>
    </main>
  </div>
</body>
</html>
