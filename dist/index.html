<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#101914" />
  <meta name="description" content="BOT 质押复利收益对比" />
  <title>BOT 质押收益计算器</title>
  <style>
    :root{--ink:#111914;--sub:#77827c;--bg:#f3f5f2;--card:#fff;--line:#e2e7e3;--green:#42d895;--green-dark:#08784c;--dark:#101914;--soft:#e9f8f0}
    *{box-sizing:border-box}body{margin:0;background:#e1e6e2;color:var(--ink);font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}.app{width:min(100%,430px);min-height:100vh;margin:0 auto;background:var(--bg);box-shadow:0 0 60px rgba(16,35,26,.14);padding-bottom:max(22px,env(safe-area-inset-bottom))}
    main{padding:calc(14px + env(safe-area-inset-top)) 14px 14px}.market-bar{display:flex;align-items:center;justify-content:space-between;margin:0 2px 18px}.market-token{display:flex;align-items:center;gap:9px}.market-icon{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--dark);color:var(--green);font-size:10px;font-weight:850}.market-copy b{display:block;font-size:14px}.market-copy span{display:block;color:var(--sub);font-size:12px;margin-top:2px}.market-price{text-align:right}.market-price span{display:block;color:var(--sub);font-size:12px}.market-price strong{display:block;font-size:18px;margin-top:2px}.section-title{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px}.section-title h2{margin:0;font-size:18px;letter-spacing:-.02em}.section-title span{color:var(--sub);font-size:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 24px rgba(18,45,32,.05)}
    .amount-card{padding:16px}.label{display:flex;justify-content:space-between;align-items:center;color:var(--sub);font-size:12px}.balance{color:#52635a}.amount-line{height:64px;display:flex;align-items:center;border-bottom:1px solid var(--line)}.amount-line input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font-size:32px;font-weight:850;letter-spacing:-.045em}.unit{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:850}.coin{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;background:var(--dark);color:var(--green);font-size:10px}.usd{margin-top:8px;color:#89958f;font-size:12px}.quick{display:flex;gap:7px;overflow-x:auto;margin-top:12px;scrollbar-width:none}.quick::-webkit-scrollbar{display:none}.quick button{flex:0 0 auto;border:1px solid var(--line);border-radius:8px;background:#f7f9f7;padding:8px 12px;color:#67746e;font-size:12px;cursor:pointer}.quick button:last-child{background:var(--soft);border-color:#cbeedc;color:var(--green-dark)}.error{min-height:18px;margin-top:4px;color:#d54e5e;font-size:12px}
    .plans-section{margin-top:20px}.note{margin:-1px 0 10px;color:#7b8881;font-size:12px;line-height:1.55}.table{overflow:hidden}.table-head,.plan{display:grid;grid-template-columns:.64fr .76fr 1.08fr 1.62fr;align-items:center;column-gap:5px}.table-head{padding:10px;background:#f8faf8;border-bottom:1px solid var(--line);color:#8b9690;font-size:12px;line-height:1.25}.table-head span:last-child{text-align:right}.plan{min-height:78px;padding:12px 10px;border-bottom:1px solid var(--line)}.plan:last-child{border-bottom:0}.cell{min-width:0}.identity b{display:block;font-size:14px}.identity span{display:block;color:#99a39e;font-size:12px;margin-top:3px}.rate-cell b{display:block;color:var(--green-dark);font-size:14px}.rate-cell span,.release-cell span,.yield-cell span{display:block;color:#9aa49f;font-size:12px;margin-top:3px}.release-cell b{display:block;font-size:12px;line-height:1.25}.yield-cell{text-align:right}.yield-cell b{display:block;color:var(--green-dark);font-size:12px;line-height:1.25}.yield-cell span{white-space:nowrap}.footnote{margin:13px 4px 0;color:#98a39d;text-align:center;font-size:12px;line-height:1.55}
    button,input{font:inherit}button{cursor:pointer}.title-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 2px 14px}.title-row h1{margin:0;font-size:24px;letter-spacing:-.04em}.calculator-trigger{display:flex;align-items:center;gap:7px;border:1px solid #bfead5;border-radius:999px;background:var(--soft);padding:9px 14px;color:var(--green-dark);font-size:14px;font-weight:800;box-shadow:0 5px 14px rgba(20,124,79,.08)}.calculator-trigger svg{width:16px;height:16px}.calculator-trigger:active{transform:translateY(1px)}
    .stake-card{position:relative;overflow:hidden;min-height:152px;border:1px solid #26362e;border-radius:20px;background:linear-gradient(135deg,#111a15 0%,#101914 60%,#193929 100%);padding:24px;color:#fff;box-shadow:0 16px 35px rgba(13,37,25,.13)}.stake-card::after{content:"BOT";position:absolute;right:-14px;bottom:-21px;color:rgba(66,216,149,.10);font-size:76px;font-weight:900;letter-spacing:-.08em}.stake-card strong{display:block;color:var(--green);font-size:22px}.stake-card p{position:relative;z-index:1;margin:14px 0 0;color:#dbe6df;font-size:15px;line-height:1.65}.stake-card .tip{display:inline-flex;align-items:center;gap:6px;margin-top:15px;color:#9eb0a6;font-size:12px}.stake-card .tip::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(66,216,149,.1)}
    dialog{width:min(calc(100% - 16px),430px);max-height:calc(100dvh - 16px);margin:auto;padding:0;border:0;border-radius:22px;background:var(--bg);color:var(--ink);box-shadow:0 28px 90px rgba(5,18,11,.34);overflow:hidden}dialog:not([open]){display:none}dialog::backdrop{background:rgba(5,15,10,.62);backdrop-filter:blur(5px)}.modal{display:flex;max-height:calc(100dvh - 16px);flex-direction:column}.modal-head{display:flex;align-items:center;justify-content:space-between;flex:0 0 auto;padding:17px 16px 14px;background:rgba(243,245,242,.96);border-bottom:1px solid var(--line)}.modal-title{display:flex;align-items:center;gap:10px}.modal-title .market-icon{width:34px;height:34px}.modal-title h2{margin:0;font-size:20px;letter-spacing:-.03em}.modal-title span{display:block;margin-top:3px;color:var(--sub);font-size:12px}.icon-close{width:36px;height:36px;border:1px solid var(--line);border-radius:50%;background:#fff;color:#66736d;font-size:22px;line-height:1}.modal-body{overflow-y:auto;padding:16px}.modal-footer{flex:0 0 auto;padding:11px 14px calc(11px + env(safe-area-inset-bottom));background:rgba(243,245,242,.96);border-top:1px solid var(--line)}.confirm{width:100%;border:0;border-radius:12px;background:var(--dark);padding:14px;color:#fff;font-size:15px;font-weight:800;box-shadow:0 8px 20px rgba(16,25,20,.18)}.confirm:active{transform:translateY(1px)}button:focus-visible,input:focus-visible{outline:2px solid var(--green);outline-offset:2px}
    @media(min-width:700px){body{padding:22px 0}.app{border-radius:28px;min-height:calc(100vh - 44px);overflow:hidden}dialog,.modal{max-height:calc(100vh - 44px)}}
  </style>
</head>
<body>
  <div class="app">
    <main>
      <div class="market-bar"><div class="market-token"><span class="market-icon">BOT</span><div class="market-copy"><b>BOT</b><span>质押收益服务</span></div></div><div class="market-price"><span>当前参考单价</span><strong>$12.20</strong></div></div>
      <div class="title-row"><h1>BOT质押</h1><button class="calculator-trigger" id="openCalculator" type="button" aria-haspopup="dialog" aria-controls="calculatorDialog"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="4" y="2.75" width="16" height="18.5" rx="3" stroke="currentColor" stroke-width="1.8"/><path d="M7.5 7h9M8 11h2m4 0h2m-8 4h2m4 0h2m-8 4h2m4 0h2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>收益计算器</button></div>
      <section class="stake-card" aria-label="BOT 质押简介"><strong>BOT质押</strong><p>质押 BOT 获得收益<br>复利计算，方案一屏对比</p><span class="tip">点击右上角查看预计收益</span></section>
    </main>
  </div>
  <dialog id="calculatorDialog" aria-labelledby="calculatorTitle">
    <div class="modal">
      <header class="modal-head"><div class="modal-title"><span class="market-icon">BOT</span><div><h2 id="calculatorTitle">收益计算器</h2><span>输入 BOT 数量，查看不同方案的预计收益</span></div></div><button class="icon-close" id="closeCalculator" type="button" aria-label="关闭收益计算器">×</button></header>
      <div class="modal-body">
        <section><div class="section-title"><h2>输入质押数量</h2><span>STEP 01</span></div><div class="card amount-card"><div class="label"><span>质押金额</span><span class="balance">可用 12,580 BOT</span></div><div class="amount-line"><input id="amount" aria-label="BOT 质押数量" inputmode="decimal" value="1000"><div class="unit"><span class="coin">B</span>BOT</div></div><div class="usd" id="principalUsd">≈ $12,200.00</div><div class="quick"><button data-amount="100" type="button">100</button><button data-amount="500" type="button">500</button><button data-amount="1000" type="button">1,000</button><button data-amount="5000" type="button">5,000</button><button data-amount="12580" type="button">MAX</button></div><div class="error" id="error" aria-live="polite"></div></div></section>
        <section class="plans-section"><div class="section-title"><h2>收益方案</h2><span>按日复利</span></div><p class="note">昨日收益与未释放本金共同参与今日计息；活期收益统一按持有 30 天估算。</p><div class="card table"><div class="table-head"><span>方案</span><span>日收益率</span><span>每日释放本金</span><span>总收益 / 价值</span></div><div id="planList"></div></div><div class="footnote">以上结果为模型估算，到期总收益不含原始本金，不构成收益承诺或投资建议。</div></section>
      </div>
      <footer class="modal-footer"><button class="confirm" id="confirmCalculator" type="button">确定</button></footer>
    </div>
  </dialog>
  <script>
    const PRICE=12.2,MAX=12580;
    const plans=[
      {key:'flex',name:'活期',rate:.002,days:30,type:'灵活',release:'随时提取'},
      {key:'30',name:'30 天',rate:.0027,days:30,type:'定期'},
      {key:'90',name:'90 天',rate:.0033,days:90,type:'定期'},
      {key:'180',name:'180 天',rate:.0042,days:180,type:'定期'},
      {key:'360',name:'360 天',rate:.0052,days:360,type:'定期'}
    ];
    const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
    const fmt=(n,d=2)=>Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
    const bot=(n,d=4)=>`${fmt(n,d)} BOT`,usd=n=>`$${fmt(n,2)}`;
    function amount(){const n=Number($('#amount').value.replace(/,/g,''));return Number.isFinite(n)?Math.max(0,n):0}
    function calculate(value,p){
      if(p.key==='flex')return value*(Math.pow(1+p.rate,p.days)-1);
      const dailyRelease=value/p.days;let balance=value,total=0;
      for(let day=1;day<=p.days;day++){const reward=balance*p.rate;total+=reward;balance=balance+reward-dailyRelease}
      return total;
    }
    function validate(value){let message='';if(value<=0)message='请输入大于 0 的 BOT 数量';else if(value>MAX)message=`输入数量超过可用余额 ${fmt(MAX,0)} BOT`;$('#error').textContent=message}
    function render(){
      const value=amount();validate(value);$('#principalUsd').textContent=`≈ ${usd(value*PRICE)}`;
      $('#planList').innerHTML=plans.map(p=>{const reward=calculate(value,p);const release=p.key==='flex'?p.release:fmt(value/p.days,4);return `<article class="plan"><div class="cell identity"><b>${p.name}</b><span>${p.type}</span></div><div class="cell rate-cell"><b>${fmt(p.rate*100,2)}%</b><span>每日</span></div><div class="cell release-cell"><b>${release}</b><span>${p.key==='flex'?'本金及收益':'BOT / 日'}</span></div><div class="cell yield-cell"><b>+${fmt(reward,4)} BOT</b><span>${usd(reward*PRICE)}${p.key==='flex'?' · 30天':''}</span></div></article>`}).join('');
    }
    const dialog=$('#calculatorDialog'),trigger=$('#openCalculator');
    function openCalculator(){render();dialog.showModal();requestAnimationFrame(()=>$('#amount').focus())}
    function closeCalculator(){dialog.close();trigger.focus()}
    trigger.addEventListener('click',openCalculator);$('#closeCalculator').addEventListener('click',closeCalculator);$('#confirmCalculator').addEventListener('click',closeCalculator);dialog.addEventListener('click',event=>{if(event.target===dialog)closeCalculator()});
    $('#amount').addEventListener('input',render);$$('[data-amount]').forEach(button=>button.addEventListener('click',()=>{$('#amount').value=button.dataset.amount;render()}));render();
  </script>
</body>
</html>
